name: Validate Status telemetry CORS branch

on:
  push:
    branches: [fix/status-telemetry-cors]
    paths:
      - ".github/workflows/phase3-validate-cors.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-phase3-cors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: fix/status-telemetry-cors
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Validate local detector and edge Worker
        run: |
          set -euo pipefail
          python3 -m compileall local
          python3 -m unittest discover -s local/tests -v
          npm ci --prefix worker
          npm run lint --prefix worker
          npm test --prefix worker
          cd worker
          npx wrangler deploy --dry-run --outdir dist
          cd ..
          git diff --check
      - name: Commit validation marker
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema_version":"atlas-systems/specular-cors-validation/v1","result":"pass"}' > .phase3-cors-validation.json
          git add .phase3-cors-validation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record Status telemetry CORS validation"
          git push origin HEAD:fix/status-telemetry-cors
